<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Unlinked</title>
  <style>
    body {
      margin: 0; padding: 0;
      display: flex; justify-content: center; align-items: center;
      height: 100vh;
      background-color: #0f1115;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
    }
    .container {
      text-align: center;
      background: #181a20;
      padding: 3rem;
      border-radius: 24px;
      border: 1px solid #2a2e37;
      max-width: 400px;
    }
    .icon {
      width: 80px; height: 80px;
      background: rgba(244, 63, 94, 0.1);
      color: #f43f5e;
      border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      margin: 0 auto 1.5rem auto;
    }
    h1 { margin: 0 0 1rem 0; font-size: 24px; }
    p { color: #9ca3af; line-height: 1.6; margin-bottom: 2rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
      </svg>
    </div>
    <h1>Device Unlinked</h1>
    <p>This browser has been unlinked from the Parent Dashboard. It has been locked for your safety and cannot be used to access the internet until it is relinked.</p>
  </div>
</body>
</html>
